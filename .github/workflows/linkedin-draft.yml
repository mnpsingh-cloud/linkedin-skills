name: LinkedIn Draft

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */2 * *"

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate LinkedIn draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          with open("skills/linkedin-post-writer/SKILL.md", "r", encoding="utf-8") as f:
              skill = f.read()

          prompt = f"""
          You are my LinkedIn content writer.

          Follow the LinkedIn Post Writer skill below carefully.

          IMPORTANT:
          - Never invent or assume statistics, percentages, customer counts, revenue figures, time periods, or other numerical claims.
          - Write for a professional who is transitioning toward higher-value customer success,
            SaaS, B2B, and business roles.
          - Do not position me as a real-estate salesperson.
          - Produce ONE LinkedIn post draft.
          - The post must be useful and credible, not generic motivational content.
          - This is a DRAFT ONLY. Do not publish anything.

          SKILL:
          {skill}

          TASK:
          Write a LinkedIn post about a practical lesson professionals can learn from
          working with customers and business teams.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent",
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              print("Gemini API error:")
              print(error_body)
              raise

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          if not text:
              raise RuntimeError("Gemini returned no draft")

          print("\n===== LINKEDIN DRAFT =====\n")
          print(text)
          print("\n===== END DRAFT =====\n")
          PY
